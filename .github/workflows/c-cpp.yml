name: Android APK Build

on:
  push:
    branches: [ "port" ]
  pull_request:
    branches: [ "port" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -keystore android/perfectdark-release.keystore \
            -alias perfectdark \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass perfectdark123 \
            -keypass perfectdark123 \
            -dname "CN=Perfect Dark Port, OU=Game, O=Port, L=Unknown, S=Unknown, C=BR" \
            -noprompt || true

      - name: Write keystore.properties
        run: |
          {
            echo "storeFile=perfectdark-release.keystore"
            echo "storePassword=perfectdark123"
            echo "keyAlias=perfectdark"
            echo "keyPassword=perfectdark123"
          } > android/keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build signed release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Rename APK with build info
        id: rename_apk
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_DEST="perfect-dark-port-${SHORT_SHA}.apk"
          mv "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Perfect Dark Port – Latest Build"
          body: |
            🎮 **Automatic build** do branch `port`

            **Commit:** [`${{ steps.rename_apk.outputs.short_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Data:** ${{ github.event.head_commit.timestamp }}

            ### Como instalar
            1. Baixe o arquivo `.apk` abaixo
            2. No Android, habilite **"Instalar de fontes desconhecidas"**
            3. Instale o APK
            4. Coloque a ROM `Perfect Dark (USA).z64` na pasta indicada pelo app

            > ⚠️ Esta é uma build de desenvolvimento, pode conter bugs.
          files: ${{ steps.rename_apk.outputs.apk_path }}
          prerelease: true
          make_latest: true
          replace_latest: true
          draft: false
